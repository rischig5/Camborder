<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camborder Overlay</title>
<link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <svg id="frame-svg">
    <defs>
      <linearGradient id="border-gradient" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
        <stop id="grad-stop-1" offset="0%" stop-color="#9146FF"></stop>
        <stop id="grad-stop-2" offset="100%" stop-color="#00D8D8"></stop>
      </linearGradient>
    </defs>
    <g id="border-shape-wrap"></g>
  </svg>
  <div id="camborder-label" class="camborder-label" style="display:none;"></div>

  <script src="js/settings-store.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
